name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync poe fmt-check
      - run: uv run --no-sync poe lint
      - run: uv run --no-sync poe lint-imports
      - run: uv run --no-sync poe typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync poe test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync poe audit
      - run: docker build --target production --tag mixhound:ci .
      - name: Smoke-test the image
        run: |
          docker run --detach --name mixhound -p 127.0.0.1:8000:8000 mixhound:ci
          for _ in $(seq 1 20); do
            curl --silent --fail http://127.0.0.1:8000/live && exit 0
            sleep 1
          done
          docker logs mixhound
          exit 1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: mixhound:ci
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
