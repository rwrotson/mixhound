# Trivy reads this file from the working directory when scanning the image.
allow-rules:
  # The Anthropic SDK documents `{"type": "service_account"}` payloads; the gcp-service-account rule flags them.
  - id: anthropic-sdk-docstrings
    description: Example service-account payloads in Anthropic SDK docstrings
    path: app/\.venv/lib/python3\.\d+/site-packages/anthropic/
