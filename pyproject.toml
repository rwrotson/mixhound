# PROJECT ----------------------------------------------------------------------
[project]
name = "mixhound"
version = "0.1.0"
description = "Crate-digging agent: finds recordings similar to weighted references, verifies them against catalogs, and returns playable sources"
authors = [
    { name = "Igor Lashkov", email = "rwrotson@yandex.ru" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deadwax",
    "fastapi>=0.120.0",
    "httpx>=0.28.1",
    "librosa>=1.0.1",
    "numpy>=2.5.5",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "uvicorn>=0.38.0",
]

[project.scripts]
mixhound = "mixhound.main:serve"

[dependency-groups]
dev = [
    "commitizen>=4.19.2",
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-socket>=0.8.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20261113",
]

# BUILD BACKEND ----------------------------------------------------------------
[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Security floors for transitive dependencies.
constraint-dependencies = [
    "certifi>=2026.10.18",
    "filelock>=4.2.1",
    "urllib3>=2.8.0",
    "virtualenv>=21.14.9",
]

[tool.uv.build-backend]
module-name = "mixhound"
module-root = "src"

[tool.uv.sources]
deadwax = { git = "https://github.com/rwrotson/deadwax", tag = "v0.1.0" }

# PYTEST -----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Sockets are blocked so no test reaches the network; asyncio needs unix socket pairs.
addopts = "-ra --tb=short --strict-markers --strict-config -n auto --disable-socket --allow-unix-socket -m 'not live'"
markers = ["live: needs network and real services; run with `pytest -m live`"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
timeout = 30

[tool.coverage.run]
source = ["mixhound"]
omit = ["*/__init__.py"]
branch = true
parallel = true
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# MYPY -------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]
exclude_gitignore = true
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# RUFF -------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "ASYNC", "ANN", "S", "RUF", "TID", "C4", "SIM", "PT", "RET", "ARG",
    "PERF", "FURB", "PL", "DTZ", "T20", "ERA", "BLE", "N", "PIE",
    "D101", "D102", "D103", "PGH003", "PGH004", "T100", "C901", "FBT003",
    "A001", "A002", "A004", "A005", "A006",
    "G001", "G002", "G003", "G004", "G101", "G201", "G202",
    "LOG001", "LOG002", "LOG014", "LOG015",
]

[tool.ruff.lint.per-file-ignores]
# ASYNC240: async tests inspect the files an adapter wrote; blocking there is harmless.
"tests/**" = ["PLR2004", "ARG", "S101", "S105", "S106", "D101", "D102", "D103", "ASYNC240"]
"evals/**" = ["PLR2004", "S101", "D101", "D102", "D103"]
# Package __init__ files re-export from sibling modules.
"src/**/__init__.py" = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.isort]
known-first-party = ["mixhound"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# COMMITIZEN -------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

# IMPORT-LINTER ----------------------------------------------------------------
[tool.importlinter]
root_package = "mixhound"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Application layers"
type = "layers"
layers = [
    "mixhound.main",
    "mixhound.container",
    "mixhound.api",
    "mixhound.agents",
    "mixhound.tools | mixhound.infrastructure",
    "mixhound.services",
    "mixhound.memory",
    "mixhound.models",
]

[[tool.importlinter.contracts]]
name = "Services, memory and models stay independent of transport, LLM runtime and I/O clients"
type = "forbidden"
source_modules = ["mixhound.services", "mixhound.memory", "mixhound.models"]
forbidden_modules = [
    "fastapi", "starlette", "pydantic_ai", "httpx", "pydantic_settings", "structlog",
    "mixhound.config",
]

[[tool.importlinter.contracts]]
name = "Tools and agents do not depend on HTTP transport"
type = "forbidden"
source_modules = ["mixhound.tools", "mixhound.agents"]
forbidden_modules = ["fastapi", "starlette", "mixhound.api"]

[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on HTTP transport"
type = "forbidden"
source_modules = ["mixhound.infrastructure"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "The API does not know which tools the agents call"
type = "forbidden"
source_modules = ["mixhound.api"]
forbidden_modules = ["mixhound.tools", "mixhound.agents", "pydantic_ai"]

[[tool.importlinter.contracts]]
name = "Configuration has no application dependencies"
type = "forbidden"
source_modules = ["mixhound.config"]
forbidden_modules = [
    "mixhound.api", "mixhound.agents", "mixhound.tools", "mixhound.services",
    "mixhound.memory", "mixhound.infrastructure", "mixhound.container",
]

[[tool.importlinter.contracts]]
name = "Only infrastructure talks to deadwax"
type = "forbidden"
source_modules = [
    "mixhound.main", "mixhound.container", "mixhound.config", "mixhound.api", "mixhound.agents",
    "mixhound.tools", "mixhound.services", "mixhound.memory", "mixhound.models",
]
forbidden_modules = ["deadwax"]
# Only direct imports: the container reaches deadwax through the infrastructure adapter.
allow_indirect_imports = true

# POETHEPOET -------------------------------------------------------------------
[tool.poe.tasks]
serve = "uvicorn mixhound.main:create_app --factory --reload --no-access-log"
fmt = "ruff format ."
fmt-check = "ruff format --check ."
lint = "ruff check ."
lint-imports = "lint-imports"
typecheck = "mypy"
test = "pytest --cov"
test-fast = "pytest"
check = ["fmt-check", "lint", "lint-imports", "typecheck", "test"]

[tool.poe.tasks.audit]
shell = """
uv export --quiet --format requirements-txt --all-groups --locked --no-emit-project --no-hashes --output-file requirements-audit.txt
uv run --locked --with pip-audit pip-audit --requirement requirements-audit.txt --no-deps
"""
