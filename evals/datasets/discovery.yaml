name: discovery
cases:
- name: psych
  inputs:
    instructions: 'Песни в стиле поп-психоделии 60-х годов -- хиппи, LSD, солнце, цветы -- но в более
      современном звуке, приближенном к инди-року. Меланхоличное, немного грустное, но преимущественно
      светлое настроение, мечтательность. Действительно хитовые, не обязательно суперпопулярные, но с
      изысканной аранжировкой, и небанальным сонграйтингом. Возможно, отклоняющаяся от стандартной, усложненная
      структура. Психоделичные гитары, хорошо скомпрессированные ударные и бас, клависин очень желателен.
      Нарядный солнечный звук: возможны клавишные, скрипки, оркестр или синтезатор как подложка, легкое
      или умеренное наличие реверба и/или хоруса. Легко обработанный эффектами вокал. Отдаленно обыгрывается
      звук, похожий на стену звука Фила Спектора, сильные ретро-вайбы. Скорее всего много подобного в
      инди-роке 10-х, а-ля трендовые альбомы Pitchfork того времени, но пойдут и любые записи нулевых
      годов и позже.'
    settings:
      year_from: 1990
      exclude_reference_artists: true
    references:
