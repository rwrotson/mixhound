- name: noch
  inputs:
    instructions: 'андерграунд, экспериментальная сцена. медленная, но ритмичная инструментальная музыка,
      по большей части живые инструменты, гитарный бас -- ведущий инструмент. минимализм, глуховатый звук
      с обилием реверба. ударные -- драм-машина или ударник, чем-то похожий на нее. возможно отдаленное
      влияние пост-панка и даба, использование электронных инструментов. gloomy atmosphere. исполнитель
      имеет какое-то отношение к россии в широком смысле, ссср / снг тоже принимается. главный референс:
      альбом "курорты кавказа" группы "ночной проспект". возможно, много что получится найти, если покопать
      вглубь музыку, имеющую отношение к лейблу Gost Zvuk и его пространству Наука и искусство -- не обязательно
      релизы с этого лейбла (там обычно более электронная или абстрактная музыка) -- возможно в рассказах
      или миксах людей, связанных с этим лейблом.'
    settings:
      year_from: 1980
      exclude_reference_artists: true
    references:
